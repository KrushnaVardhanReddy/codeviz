name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release
      - name: Rename binary
        run: mv target/release/codeviz-cli target/release/codeviz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeviz
          path: target/release/codeviz
          if-no-files-found: error

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build binary
        run: cargo build --release
      - name: Rename binary
        run: mv target/release/codeviz-cli target/release/codeviz-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeviz-macos
          path: target/release/codeviz-macos
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: codeviz
          path: artifacts
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: codeviz-macos
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/codeviz
            artifacts/codeviz-macos
          generate_release_notes: true
