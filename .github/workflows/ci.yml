name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  wasm-build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm
        run: wasm-pack build codeviz-wasm --target web
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeviz-wasm-pkg
          path: codeviz-wasm/pkg/
          if-no-files-found: error

  wasm-size:
    name: Check WASM Size
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: codeviz-wasm-pkg
          path: codeviz-wasm-pkg
      - name: Assert size
        run: |
          size=$(stat -c%s codeviz-wasm-pkg/*.wasm)
          echo "WASM size is $size bytes"
          if [ "$size" -gt 3145728 ]; then
            echo "WASM bundle exceeds 3MB limit"
            exit 1
          fi
