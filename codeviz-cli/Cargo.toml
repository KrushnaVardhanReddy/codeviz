[package]
name = "codeviz-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
codeviz-mcp = { path = "../codeviz-mcp" }
codeviz-core = { path = "../codeviz-core" }
codeviz-python = { path = "../codeviz-python" }
codeviz-typescript = { version = "0.1.0", path = "../codeviz-typescript" }
codeviz-go = { version = "0.1.0", path = "../codeviz-go" }
codeviz-rust = { path = "../codeviz-rust" }
codeviz-java = { path = "../codeviz-java" }
codeviz-kotlin = { path = "../codeviz-kotlin" }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.1.2"
notify = "8.2.0"
chrono = "0.4.45"
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.0.16"
predicates = "3.1.2"
libc = "0.2.189"
